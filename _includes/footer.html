<footer class="site-footer h-card">
  <hr>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
      {%- if site.author %}
          {% if site.author.name -%}
            <div class="author-name">{{ site.author.name | escape }}</div>
          {% endif -%}
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

  </div>

</footer>
