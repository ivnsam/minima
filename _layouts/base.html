<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel='icon' type='image/gif' href="{{ site.favicon_path  | default: '/favicon.gif' }}" />

    <style>
      * {
        text-decoration: none;
      }
      body {
        background-color: #0d0406;
        color: #f3f3f3;
      }
      a {
        color: #492b9a;
      }
      a:visited {
        color: #40a9f8;
      }
    </style>
    
  </head>

  <body>
    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
